# BOLO (Birds Only Live Once) — AvianRaptorNet extended YOLO11 detector
# Base: ultralytics yolo11.yaml (n scale, channels after width=0.25 is applied)
#
# Custom modules (RaptorFoveal/FeatherBlock/MotionStrideAttention) are
# channel-preserving; the first arg must match the actual input channels.
# - Backbone: RaptorFoveal (dual fovea) after the stem, FeatherBlock in the
#   P3/P4 stages
# - Motion correction: MotionStrideAttention on P5 (large momentum) and
#   P3 (fine momentum)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# BOLO backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 ->16ch
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 ->32ch
  - [-1, 1, RaptorFoveal, [32]] # 2 raptor dual fovea (channel-preserving)
  - [-1, 2, C3k2, [256, False, 0.25]] # 3 ->64ch
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8 ->64ch
  - [-1, 2, C3k2, [512, False, 0.25]] # 5 ->128ch
  - [-1, 1, FeatherBlock, [128]] # 6 (channel-preserving)
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16 ->128ch
  - [-1, 2, C3k2, [512, True]] # 8 ->128ch
  - [-1, 1, FeatherBlock, [128]] # 9 (channel-preserving)
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32 ->256ch
  - [-1, 2, C3k2, [1024, True]] # 11 ->256ch
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 2, C2PSA, [1024]] # 13
  - [-1, 1, MotionStrideAttention, [256]] # 14 large-momentum correction (P5)

# BOLO head (YOLO11 PAN)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 9], 1, Concat, [1]] # 16 cat backbone P4 (128+256=384)
  - [-1, 2, C3k2, [512, False]] # 17 ->128ch

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 5], 1, Concat, [1]] # 19 cat backbone P3 (128+128=256)
  - [-1, 2, C3k2, [256, False]] # 20 (P3/8-small) ->64ch
  - [-1, 1, MotionStrideAttention, [64]] # 21 fine-momentum correction (P3)

  - [-1, 1, Conv, [256, 3, 2]] # 22 ->64ch
  - [[-1, 17], 1, Concat, [1]] # 23 cat head P4 (64+128=192)
  - [-1, 2, C3k2, [512, False]] # 24 (P4/16-medium) ->128ch

  - [-1, 1, Conv, [512, 3, 2]] # 25 ->128ch
  - [[-1, 14], 1, Concat, [1]] # 26 cat motion-corrected P5 (128+256=384)
  - [-1, 2, C3k2, [1024, True]] # 27 (P5/32-large) ->256ch

  - [[21, 24, 27], 1, Detect, [nc]] # 28 Detect(P3, P4, P5)
